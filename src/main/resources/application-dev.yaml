spring:
    config:
        import: optional:file:.env_dev[.properties]
    datasource:
        url: ${DEV_DB_URL:jdbc:postgresql://localhost:5432/postgres}
        username: ${DEV_DB_USERNAME:postgres}
        password: ${DEV_DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${DEV_MAIL_USERNAME}
        password: ${DEV_MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

jwt:
    secret: ${DEV_JWT_SECRET}
    expiration: ${DEV_JWT_EXPIRATION}
    refresh-expiration: ${DEV_JWT_REFRESH_EXPIRATION}
    
cloudinary:
  url: ${CLOUDINARY_URL}
